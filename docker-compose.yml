services:
  knarr:
    image: raudssus/langertha-knarr
    # Or build locally: build: .
    ports:
      - "8080:8080"
      - "11434:11434"
    env_file:
      - path: .env
        required: false
    environment:
      - LANGFUSE_URL=http://langfuse:3000
    depends_on:
      - langfuse

  # Langfuse v2: runs on Postgres alone. Langfuse v3 (the :latest tag) also
  # needs ClickHouse, Redis and S3-compatible storage, which this file does
  # not provide.
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      # No defaults on purpose: generate these into .env (see .env.example).
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env (openssl rand -hex 16)}@db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env (openssl rand -base64 32)}
      # Headless init: on startup Langfuse creates this org and project and
      # registers Knarr's own LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY as the
      # project's API keys. Without both keys no keys are created. The login
      # user is created only when LANGFUSE_INIT_USER_PASSWORD is set.
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-knarr}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-Knarr}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-knarr}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Knarr}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@knarr.local}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Knarr Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=langfuse
      # Only applied when the pgdata volume is created; an existing volume
      # keeps its password (it was "langfuse" before this was configurable).
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env (openssl rand -hex 16)}
      - POSTGRES_DB=langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
