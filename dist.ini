name    = Langertha-Knarr
author  = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
license = Perl_5
copyright_holder = Torsten Raudssus
copyright_year   = 2026

; Getty release command:
;   dzil release
; docker_image below makes the bundle add Dist::Zilla::Plugin::Docker::API. It talks to the
; container engine at DOCKER_HOST over the Engine HTTP API (no docker binary; rootless Podman
; works) and builds the image from the built dist in every build -- dzil build, dzil test
; and dzil release alike. The release then tags and pushes docker_tags: latest, <major>,
; <version>. Push credentials are read from ~/.docker/config.json (or $DOCKER_CONFIG) only.
;   DZIL_DOCKER_API_SKIP=1 dzil build    # or dzil test: no engine contact, no image
; dzil release refuses to run with that variable set.
; KNARR_DOCKER_BUILD_ARGS and LANGERTHA_SRC no longer exist on the release path: no build
; arguments are passed, and the Dockerfile has no LANGERTHA_SRC ARG.
; Note: do not use GitHub source archives (/archive/refs/*) for dzil dists.

[@Author::GETTY]
irc = #langertha
irc_user = Getty
run_after_release = ${GH_BIN:-gh} release view %v -R Getty/langertha-knarr >/dev/null 2>&1 || ${GH_BIN:-gh} release create %v -R Getty/langertha-knarr --title %v --notes 'Dist::Zilla release'
run_after_release = ${GH_BIN:-gh} release upload %v -R Getty/langertha-knarr Langertha-Knarr-%v.tar.gz --clobber
docker_image = raudssus/langertha-knarr
docker_tags = latest %V %v
